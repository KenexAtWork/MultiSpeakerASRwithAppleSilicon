# 輕量級測試 - 不需要 MLX/Apple Silicon
# 只測試不依賴硬體的邏輯部分

name: Tests (Lite)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-lite:
    runs-on: ubuntu-latest  # 使用 Linux，更快更便宜
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        # 安裝測試所需的最小依賴
        pip install pytest
    
    - name: Debug - Show directory structure
      run: |
        echo "Current directory:"
        pwd
        echo ""
        echo "Directory contents:"
        ls -la
        echo ""
        echo "Looking for asr directory:"
        find . -name "asr" -type d
        echo ""
        echo "Looking for test files:"
        find . -name "test_*.py" | head -5
    
    - name: Run logic tests (no MLX required)
      run: |
        # Repo 根目錄就是 asr 專案，不需要 cd 或加 asr/ 前綴
        python tests/test_merge_srt.py
        python tests/test_srt_parser.py
    
    - name: Test summary
      if: always()
      run: |
        echo "✅ 邏輯測試完成"
        echo "⚠️  完整測試（含 MLX）請在本地執行: ./run_tests.sh"
