<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live ASR — Dual Engine Compare</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --primary: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --muted: #888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 24px;
      background: var(--surface);
    }

    .controls label {
      font-size: 13px;
      color: var(--muted);
    }

    .controls select,
    .controls button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: var(--primary);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    .btn-record {
      background: var(--accent);
      border: none;
      font-weight: 600;
      min-width: 120px;
      transition: all 0.2s;
    }

    .btn-record:hover {
      opacity: 0.9;
    }

    .btn-record.recording {
      background: #c0392b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .btn-export {
      background: #2e7d32;
      border: none;
      font-weight: 500;
    }

    .btn-export:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-bar {
      padding: 6px 24px;
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vu-meter {
      width: 120px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .vu-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
      transition: width 0.1s;
    }

    .timer {
      font-family: monospace;
      font-size: 14px;
      color: var(--accent);
    }

    .columns {
      flex: 1;
      display: flex;
      gap: 0;
      overflow: hidden;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }

    .column:last-child {
      border-right: none;
    }

    .col-header {
      padding: 10px 16px;
      background: var(--primary);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .col-header .engine-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .tag-nova {
      background: #e94560;
      color: #fff;
    }

    .tag-transcribe {
      background: #2196f3;
      color: #fff;
    }

    .col-status {
      padding: 4px 16px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.2);
    }

    .transcript-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      line-height: 1.7;
      font-size: 15px;
    }

    .transcript-area:empty::before {
      content: "等待語音輸入...";
      color: var(--muted);
      font-style: italic;
    }

    .segment {
      margin-bottom: 4px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .segment:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .tc {
      color: #888;
      font-size: 12px;
      font-family: monospace;
      margin-right: 6px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎙️ Live ASR — Dual Engine Compare</h1>
  </header>

  <div class="controls">
    <div>
      <label>Language</label><br>
      <select id="language">
        <option value="auto">Auto</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-record" id="recordBtn" onclick="toggleRecording()">🎙️ 開始錄音</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="exportTxtBtn" onclick="exportTxt()" disabled>📄 TXT</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="exportSrtBtn" onclick="exportSrt()" disabled>📄 SRT</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="exportWavBtn" onclick="exportWav()" disabled>🔊 WAV</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="clearBtn" onclick="clearAll()">🗑️ 清除</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="globalStatus">Ready</span>
    <span class="timer" id="timer">00:00:00</span>
    <div class="vu-meter">
      <div class="vu-fill" id="vuFill"></div>
    </div>
  </div>

  <div class="columns">
    <div class="column">
      <div class="col-header">
        <span>Nova Sonic 2</span>
        <span class="engine-tag tag-nova">☁️ Bedrock</span>
      </div>
      <div class="col-status" id="statusNova">—</div>
      <div class="transcript-area" id="transcriptNova"></div>
    </div>
    <div class="column">
      <div class="col-header">
        <span>AWS Transcribe</span>
        <span class="engine-tag tag-transcribe">☁️ Streaming</span>
      </div>
      <div class="col-status" id="statusTranscribe">—</div>
      <div class="transcript-area" id="transcriptTranscribe"></div>
    </div>
  </div>

  <script>
    // State
    let wsNova = null, wsTranscribe = null;
    let mediaStream = null, audioContext = null, processor = null;
    let recording = false, startTime = null, timerInterval = null;
    let segmentsNova = [], segmentsTranscribe = [];
    let recordedChunks = [];

    const recordBtn = document.getElementById('recordBtn');
    const globalStatus = document.getElementById('globalStatus');
    const timerEl = document.getElementById('timer');
    const vuFill = document.getElementById('vuFill');
    const tNova = document.getElementById('transcriptNova');
    const tTranscribe = document.getElementById('transcriptTranscribe');
    const sNova = document.getElementById('statusNova');
    const sTranscribe = document.getElementById('statusTranscribe');

    function updateTimer() {
      if (!startTime) return;
      const e = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = `${String(Math.floor(e / 3600)).padStart(2, '0')}:${String(Math.floor((e % 3600) / 60)).padStart(2, '0')}:${String(e % 60).padStart(2, '0')}`;
    }

    function formatTC(sec) {
      return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
    }

    function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    function appendTo(container, segments, text, elapsed) {
      segments.push({ text, timestamp: elapsed });
      const div = document.createElement('div');
      div.className = 'segment';
      div.innerHTML = `<span class="tc">[${formatTC(elapsed)}]</span>${escHtml(text)}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function createWS(engine, container, statusEl, segments) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const language = document.getElementById('language').value;
      const ws = new WebSocket(`${proto}://${location.host}/ws/asr`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        ws.send(JSON.stringify({ engine, language }));
        statusEl.textContent = 'Connecting...';
      };
      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (data.type === 'transcript') {
          const elapsed = data.time || (startTime ? (Date.now() - startTime) / 1000 : 0);
          appendTo(container, segments, data.text, elapsed);
        } else if (data.type === 'status') {
          statusEl.textContent = data.text;
        } else if (data.type === 'error') {
          statusEl.textContent = `Error: ${data.text}`;
        }
      };
      ws.onclose = () => { statusEl.textContent = 'Disconnected'; };
      ws.onerror = () => { statusEl.textContent = 'Connection error'; };
      return ws;
    }

    async function toggleRecording() {
      if (recording) stopRecording(); else await startRecording();
    }

    async function startRecording() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
      } catch (e) {
        globalStatus.textContent = 'Microphone access denied';
        return;
      }

      // Open two WebSockets
      wsNova = createWS('nova-sonic', tNova, sNova, segmentsNova);
      wsTranscribe = createWS('transcribe', tTranscribe, sTranscribe, segmentsTranscribe);

      // Audio capture
      audioContext = new AudioContext({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      analyser.connect(processor);
      processor.connect(audioContext.destination);
      const vuData = new Float32Array(analyser.fftSize);

      processor.onaudioprocess = (e) => {
        if (!recording) return;
        const f32 = e.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)));
        recordedChunks.push(new Int16Array(i16));
        // Send to both
        if (wsNova && wsNova.readyState === WebSocket.OPEN) wsNova.send(i16.buffer);
        if (wsTranscribe && wsTranscribe.readyState === WebSocket.OPEN) wsTranscribe.send(i16.buffer);
        // VU
        analyser.getFloatTimeDomainData(vuData);
        let sum = 0; for (let i = 0; i < vuData.length; i++) sum += vuData[i] * vuData[i];
        vuFill.style.width = Math.min(Math.sqrt(sum / vuData.length) * 800, 100) + '%';
      };

      recording = true;
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
      recordBtn.textContent = '⏹️ 停止錄音';
      recordBtn.classList.add('recording');
      document.getElementById('language').disabled = true;
      globalStatus.textContent = 'Recording...';
    }

    function closeWS(ws) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({ action: 'stop' })); } catch (e) { }
        ws.close();
      }
    }

    function stopRecording() {
      recording = false;
      closeWS(wsNova); closeWS(wsTranscribe);
      wsNova = null; wsTranscribe = null;
      if (processor) { processor.disconnect(); processor = null; }
      if (audioContext) { audioContext.close(); audioContext = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      clearInterval(timerInterval);
      recordBtn.textContent = '🎙️ 開始錄音';
      recordBtn.classList.remove('recording');
      document.getElementById('language').disabled = false;
      vuFill.style.width = '0%';
      globalStatus.textContent = 'Stopped';
      document.getElementById('exportTxtBtn').disabled = (segmentsNova.length + segmentsTranscribe.length) === 0;
      document.getElementById('exportSrtBtn').disabled = (segmentsNova.length + segmentsTranscribe.length) === 0;
      document.getElementById('exportWavBtn').disabled = recordedChunks.length === 0;
    }

    function clearAll() {
      tNova.innerHTML = ''; tTranscribe.innerHTML = '';
      segmentsNova = []; segmentsTranscribe = [];
      recordedChunks = [];
      timerEl.textContent = '00:00:00';
      sNova.textContent = '—'; sTranscribe.textContent = '—';
      document.getElementById('exportTxtBtn').disabled = true;
      document.getElementById('exportSrtBtn').disabled = true;
      document.getElementById('exportWavBtn').disabled = true;
      globalStatus.textContent = 'Ready';
    }

    // ---- Exports ----
    function exportTxt() {
      let txt = '=== Nova Sonic 2 ===\n';
      txt += segmentsNova.map(s => `[${formatTC(s.timestamp)}] ${s.text}`).join('\n');
      txt += '\n\n=== AWS Transcribe ===\n';
      txt += segmentsTranscribe.map(s => `[${formatTC(s.timestamp)}] ${s.text}`).join('\n');
      download('transcript_compare.txt', txt, 'text/plain');
    }

    function exportSrt() {
      const toSrt = (segs, label) => {
        let s = `# ${label}\n\n`;
        segs.forEach((seg, i) => {
          const st = fmtSrt(seg.timestamp), en = fmtSrt(seg.timestamp + 3);
          s += `${i + 1}\n${st} --> ${en}\n${seg.text}\n\n`;
        });
        return s;
      };
      const srt = toSrt(segmentsNova, 'Nova Sonic 2') + toSrt(segmentsTranscribe, 'AWS Transcribe');
      download('transcript_compare.srt', srt, 'text/plain');
    }

    function fmtSrt(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(Math.floor(sec % 60)).padStart(2, '0');
      const ms = String(Math.floor((sec % 1) * 1000)).padStart(3, '0');
      return `${h}:${m}:${s},${ms}`;
    }

    function exportWav() {
      let len = 0; recordedChunks.forEach(c => len += c.length);
      const merged = new Int16Array(len);
      let off = 0; recordedChunks.forEach(c => { merged.set(c, off); off += c.length; });
      const buf = new ArrayBuffer(44 + merged.length * 2);
      const v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + merged.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, 'data'); v.setUint32(40, merged.length * 2, true);
      for (let i = 0; i < merged.length; i++) v.setInt16(44 + i * 2, merged[i], true);
      const blob = new Blob([buf], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'recording.wav'; a.click();
      URL.revokeObjectURL(url);
    }

    function download(fn, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = fn; a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>

</html>
