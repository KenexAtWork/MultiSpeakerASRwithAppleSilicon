<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live ASR</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --primary: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --muted: #888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 16px 24px;
      background: var(--surface);
    }

    .controls label {
      font-size: 13px;
      color: var(--muted);
    }

    .controls select,
    .controls button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: var(--primary);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    .controls select:focus,
    .controls button:focus {
      outline: 2px solid var(--accent);
    }

    .btn-record {
      background: var(--accent);
      border: none;
      font-weight: 600;
      min-width: 120px;
      transition: all 0.2s;
    }

    .btn-record:hover {
      opacity: 0.9;
    }

    .btn-record.recording {
      background: #c0392b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .btn-export {
      background: #2e7d32;
      border: none;
      font-weight: 500;
    }

    .btn-export:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-bar {
      padding: 8px 24px;
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
    }

    .vu-meter {
      width: 120px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .vu-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
      transition: width 0.1s;
    }

    main {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    #transcript {
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 200px;
    }

    #transcript:empty::before {
      content: "按下「開始錄音」即時顯示語音辨識結果...";
      color: var(--muted);
      font-style: italic;
    }

    .segment {
      margin-bottom: 4px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .segment:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .timer {
      font-family: monospace;
      font-size: 14px;
      color: var(--accent);
    }
  </style>
</head>

<body>

  <header>
    <h1>🎙️ Live ASR</h1>
  </header>

  <div class="controls">
    <div>
      <label>Engine</label><br>
      <select id="engine">
        <option value="nova-sonic">Nova Sonic 2 ☁️</option>
        <option value="transcribe">AWS Transcribe ☁️</option>
      </select>
    </div>
    <div>
      <label>Language</label><br>
      <select id="language">
        <option value="auto">Auto</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-record" id="recordBtn" onclick="toggleRecording()">🎙️ 開始錄音</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="exportTxtBtn" onclick="exportTxt()" disabled>📄 TXT</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="exportSrtBtn" onclick="exportSrt()" disabled>📄 SRT</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="exportWavBtn" onclick="exportWav()" disabled>🔊 WAV</button>
    </div>
    <div>
      <label>&nbsp;</label><br>
      <button class="btn-export" id="clearBtn" onclick="clearTranscript()">🗑️ 清除</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="status">Ready</span>
    <span class="timer" id="timer">00:00:00</span>
    <div class="vu-meter">
      <div class="vu-fill" id="vuFill"></div>
    </div>
  </div>

  <main>
    <div id="transcript"></div>
  </main>

  <script>
    // State
    let ws = null;
    let mediaStream = null;
    let audioContext = null;
    let processor = null;
    let recording = false;
    let segments = [];       // {text, timestamp}
    let startTime = null;
    let timerInterval = null;

    // Audio recording buffer (for WAV export)
    let recordedChunks = [];

    const recordBtn = document.getElementById('recordBtn');
    const status = document.getElementById('status');
    const timer = document.getElementById('timer');
    const transcript = document.getElementById('transcript');
    const vuFill = document.getElementById('vuFill');

    function setStatus(msg) { status.textContent = msg; }

    function updateTimer() {
      if (!startTime) return;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      timer.textContent = `${h}:${m}:${s}`;
    }

    async function toggleRecording() {
      if (recording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function startRecording() {
      const engine = document.getElementById('engine').value;
      const language = document.getElementById('language').value;

      // Get mic
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
      } catch (e) {
        setStatus('Microphone access denied');
        return;
      }

      // WebSocket
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/asr`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        ws.send(JSON.stringify({ engine, language }));
      };

      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (data.type === 'transcript') {
          const elapsed = startTime ? ((Date.now() - startTime) / 1000) : 0;
          segments.push({ text: data.text, timestamp: elapsed });
          appendSegment(data.text);
        } else if (data.type === 'status') {
          setStatus(data.text);
        } else if (data.type === 'error') {
          setStatus(`Error: ${data.text}`);
        }
      };

      ws.onclose = () => {
        if (recording) stopRecording();
      };

      ws.onerror = () => {
        setStatus('WebSocket error');
      };

      // Audio processing: capture PCM 16kHz int16 and send via WS
      audioContext = new AudioContext({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(mediaStream);

      // ScriptProcessor for raw PCM (AudioWorklet would be better but this is simpler)
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      let analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;

      source.connect(analyser);
      analyser.connect(processor);
      processor.connect(audioContext.destination);

      const vuData = new Float32Array(analyser.fftSize);

      processor.onaudioprocess = (e) => {
        if (!recording) return;
        const float32 = e.inputBuffer.getChannelData(0);

        // Convert to int16
        const int16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          int16[i] = Math.max(-32768, Math.min(32767, Math.round(float32[i] * 32767)));
        }

        // Save for WAV export
        recordedChunks.push(new Int16Array(int16));

        // Send to server
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(int16.buffer);
        }

        // VU meter
        analyser.getFloatTimeDomainData(vuData);
        let sum = 0;
        for (let i = 0; i < vuData.length; i++) sum += vuData[i] * vuData[i];
        const rms = Math.sqrt(sum / vuData.length);
        vuFill.style.width = Math.min(rms * 800, 100) + '%';
      };

      recording = true;
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
      recordBtn.textContent = '⏹️ 停止錄音';
      recordBtn.classList.add('recording');
      document.getElementById('engine').disabled = true;
      document.getElementById('language').disabled = true;
      setStatus('Connecting...');
    }

    function stopRecording() {
      recording = false;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'stop' }));
        ws.close();
      }
      ws = null;

      if (processor) { processor.disconnect(); processor = null; }
      if (audioContext) { audioContext.close(); audioContext = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

      clearInterval(timerInterval);
      recordBtn.textContent = '🎙️ 開始錄音';
      recordBtn.classList.remove('recording');
      document.getElementById('engine').disabled = false;
      document.getElementById('language').disabled = false;
      vuFill.style.width = '0%';
      setStatus('Stopped');

      // Enable export buttons
      document.getElementById('exportTxtBtn').disabled = segments.length === 0;
      document.getElementById('exportSrtBtn').disabled = segments.length === 0;
      document.getElementById('exportWavBtn').disabled = recordedChunks.length === 0;
    }

    function appendSegment(text) {
      const div = document.createElement('div');
      div.className = 'segment';
      div.textContent = text;
      transcript.appendChild(div);
      // Auto-scroll
      transcript.scrollTop = transcript.scrollHeight;
    }

    function clearTranscript() {
      transcript.innerHTML = '';
      segments = [];
      recordedChunks = [];
      timer.textContent = '00:00:00';
      document.getElementById('exportTxtBtn').disabled = true;
      document.getElementById('exportSrtBtn').disabled = true;
      document.getElementById('exportWavBtn').disabled = true;
      setStatus('Ready');
    }

    // ---- Export functions ----

    function exportTxt() {
      const text = segments.map(s => s.text).join('\n');
      download('transcript.txt', text, 'text/plain');
    }

    function exportSrt() {
      let srt = '';
      segments.forEach((seg, i) => {
        const start = formatSrtTime(seg.timestamp);
        const end = formatSrtTime(seg.timestamp + 3); // estimate 3s per segment
        srt += `${i + 1}\n${start} --> ${end}\n${seg.text}\n\n`;
      });
      download('transcript.srt', srt, 'text/plain');
    }

    function formatSrtTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(Math.floor(sec % 60)).padStart(2, '0');
      const ms = String(Math.floor((sec % 1) * 1000)).padStart(3, '0');
      return `${h}:${m}:${s},${ms}`;
    }

    function exportWav() {
      // Merge all int16 chunks into one WAV
      let totalLen = 0;
      recordedChunks.forEach(c => totalLen += c.length);
      const merged = new Int16Array(totalLen);
      let offset = 0;
      recordedChunks.forEach(c => { merged.set(c, offset); offset += c.length; });

      const wavBuffer = encodeWav(merged, 16000);
      const blob = new Blob([wavBuffer], { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'recording.wav';
      a.click();
      URL.revokeObjectURL(url);
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      function writeStr(offset, str) { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); }
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) view.setInt16(44 + i * 2, samples[i], true);
      return buffer;
    }

    function download(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>

</html>
