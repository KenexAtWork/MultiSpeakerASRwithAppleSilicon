[project]
name = "asr-multi-speaker"
version = "0.1.0"
description = "ASR with speaker diarization for Apple Silicon Mac"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.3.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "pyannote-audio>=3.5.0",
    "huggingface-hub>=0.26.0",
    "numpy>=2.0.0",
    "librosa>=0.10.0",
]

# 可選依賴：根據需求安裝
[project.optional-dependencies]
gui = [
    "PyQt6>=6.0.0",
]
realtime = [
    "PyQt6>=6.0.0",
    "sounddevice>=0.4.0",
]
aws = [
    "boto3>=1.26.0",
]
dev = [
    "pytest>=7.0.0",
]
all = [
    "PyQt6>=6.0.0",
    "boto3>=1.26.0",
    "pytest>=7.0.0",
    "sounddevice>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gui"]  # 只打包 gui 目錄作為套件
