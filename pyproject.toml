[project]
name = "asr-multi-speaker"
version = "0.1.0"
description = "ASR with speaker diarization for M1 Mac"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.3.0",
    "pyannote-audio>=3.1.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy<2.0.0",
    "librosa>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
